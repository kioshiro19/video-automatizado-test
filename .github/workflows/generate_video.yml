name: Generate Automated Video

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-generativeai coqui-tts moviepy requests python-dotenv

    - name: Create .env file
      run: |
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
        echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env

    - name: Run script generation
      run: python generate_script.py

    - name: Run audio generation
      run: python generate_audio.py

    - name: Run stock video download
      run: python download_stock.py

    - name: Run video creation
      run: python create_video.py

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: final-video
        path: final_video.mp4
